<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#09031d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.35" filter="url(#glow)" />

  <!-- National Emblem Motif -->
  <g transform="translate(136, 90) scale(2)" fill="url(#accentGrad)">
    <path
      d="M60 4C56 4 48 10 44 14C40 18 42 24 38 27C34 30 28 32 28 38C28 44 34 47 36 53C38 59 34 65 37 70C40 75 48 76 52 82C56 88 56 94 60 94C64 94 64 88 68 82C72 76 80 75 83 70C86 65 82 59 84 53C86 47 92 44 92 38C92 32 86 30 82 27C78 24 80 18 76 14C72 10 64 4 60 4Z"
      opacity="0.95"
    />
    <path d="M46 32H74V48H46z" opacity="0.75" />
    <circle cx="60" cy="62" opacity="0.9" r="9" />
    <rect height="9" opacity="0.95" rx="2" width="70" x="25" y="98" />
    <circle cx="60" cy="115" fill="none" r="7" stroke="currentColor" stroke-width="2" />
    <rect height="6" opacity="0.95" rx="2" width="84" x="18" y="125" />
  </g>

  <!-- SARAL Text Label -->
  <text x="256" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">
    SARAL
  </text>
  <text x="256" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a78bfa" letter-spacing="3" text-anchor="middle">
    SMART RTI COPILOT
  </text>
</svg>